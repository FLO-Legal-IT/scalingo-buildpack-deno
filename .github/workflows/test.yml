name: test

on:
  push:
  pull_request:
  # Wekelijks, zodat een nieuwe Deno-release of een stack-update hier opvalt
  # en niet tijdens een productiedeploy.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck bin/detect bin/compile bin/release lib/*.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # De -minimal varianten doen mee: juist dáár ontbreekt tooling
        # (de unzip-vraag uit de README) en dat willen we in CI zien, niet
        # tijdens een productiedeploy.
        stack:
          - scalingo-22
          - scalingo-24
          - scalingo-26
          - scalingo-22-minimal
          - scalingo-24-minimal
    steps:
      - uses: actions/checkout@v4
      - name: Run buildpack tests on ${{ matrix.stack }}
        run: make ${{ matrix.stack }}-build
